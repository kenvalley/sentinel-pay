# ci-iac-scan.yml
# Reusable workflow — IaC Security Scanning
# Called by ci-pr-gate.yml on every PR touching infrastructure/.
# Scanners: Checkov, tfsec, OPA/conftest

name: CI — IaC Security Scan

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Checkov — Terraform misconfiguration scanning ─────────────────────
      - name: Install Checkov
        run: pip install checkov==3.2.202

      - name: Checkov — scan Terraform modules
        run: |
          checkov \
            --directory infrastructure/ \
            --framework terraform \
            --output json \
            --output-file checkov-results.json \
            --soft-fail \
            --skip-check CKV_AWS_117,CKV_AWS_158,CKV_AWS_338,CKV2_AWS_5 || true
          echo "Checkov scan complete"

      - name: Checkov — evaluate results
        run: |
          python3 << 'EOF'
          import json, sys, os

          if not os.path.exists("checkov-results.json") or os.path.getsize("checkov-results.json") == 0:
              print("No Checkov results file found — skipping evaluation")
              sys.exit(0)

          try:
              data = json.load(open("checkov-results.json"))
          except json.JSONDecodeError:
              print("Could not parse Checkov results — skipping")
              sys.exit(0)

          # Handle both single check and list format
          if isinstance(data, list):
              checks = data
          else:
              checks = [data]

          failed = []
          for check_data in checks:
              results = check_data.get("results", {})
              for f in results.get("failed_checks", []):
                  sev = f.get("check_result", {}).get("result", "")
                  check_id = f.get("check_id", "")
                  check_type = f.get("check_type", "terraform")
                  resource = f.get("resource", "unknown")
                  failed.append(f"[{check_id}] {resource}")
                  print(f"FAIL [{check_id}]: {resource}")

          print(f"\nCheckov summary: {len(failed)} failed checks")

          if len(failed) > 0:
              print("GATE FAILED: Checkov found misconfiguration issues.")
              sys.exit(1)

          print("GATE PASSED: No Checkov failures.")
          EOF

      # ── tfsec — second IaC scanner ────────────────────────────────────────
      - name: Install tfsec
        run: |
          wget -qO /tmp/tfsec \
            https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64
          chmod +x /tmp/tfsec
          sudo mv /tmp/tfsec /usr/local/bin/tfsec
          tfsec --version

      - name: tfsec — scan Terraform
        run: |
          tfsec infrastructure/ \
            --format json \
            --out tfsec-results.json \
            --soft-fail \
            --exclude aws-vpc-no-public-ip-subnet || true
          echo "tfsec scan complete"

      - name: tfsec — evaluate results
        run: |
          python3 << 'EOF'
          import json, sys, os

          if not os.path.exists("tfsec-results.json") or os.path.getsize("tfsec-results.json") == 0:
              print("No tfsec results — skipping")
              sys.exit(0)

          try:
              data = json.load(open("tfsec-results.json"))
          except json.JSONDecodeError:
              print("Could not parse tfsec results — skipping")
              sys.exit(0)

          results = data.get("results", []) if isinstance(data, dict) else []
          critical = [r for r in results if r.get("severity", "").upper() in ["CRITICAL", "HIGH"]]

          for r in critical:
              print(f"[{r.get('severity')}] {r.get('rule_id')}: {r.get('description')} at {r.get('location', {}).get('filename')}:{r.get('location', {}).get('start_line')}")

          print(f"\ntfsec summary: {len(critical)} HIGH/CRITICAL findings")

          if len(critical) > 0:
              print("GATE FAILED: tfsec found HIGH or CRITICAL findings.")
              sys.exit(1)

          print("GATE PASSED: No HIGH or CRITICAL tfsec findings.")
          EOF

      # ── OPA/conftest — custom policy pack ────────────────────────────────
      - name: Install conftest
        run: |
          wget -qO /tmp/conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/conftest.tar.gz -C /tmp
          sudo mv /tmp/conftest /usr/local/bin/conftest
          conftest --version

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform init
        working-directory: infrastructure/environments/production
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: terraform init -backend=false

      - name: Terraform plan for OPA
        working-directory: infrastructure/environments/production
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform plan \
            -var="github_org=kenvalley" \
            -var="github_repo=sentinel-pay" \
            -var="alarm_email=placeholder@example.com" \
            -out=tfplan || true
          terraform show -json tfplan > tfplan.json 2>/dev/null || echo '{"resource_changes":[]}' > tfplan.json

      - name: OPA/conftest — run policy pack
        working-directory: infrastructure
        run: |
          conftest test \
            --policy policies/ \
            environments/production/tfplan.json || {
            echo "GATE FAILED: OPA policy violations detected."
            exit 1
          }
          echo "GATE PASSED: All OPA policies passed."

      # ── Upload artefacts ──────────────────────────────────────────────────
      - name: Upload IaC scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-scan-results-${{ github.run_id }}
          path: |
            checkov-results.json
            tfsec-results.json
            infrastructure/environments/production/tfplan.json
          retention-days: 30
