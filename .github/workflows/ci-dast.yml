# ci-dast.yml
# Reusable workflow — Dynamic Application Security Testing
# Tool: OWASP ZAP baseline scan against ephemeral payments-api

name: CI — DAST

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  dast:
    name: DAST — ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix requirements for DAST build
        run: |
          sed -i 's/psycopg2-binary==2.9.1/psycopg2-binary==2.9.9/' services/payments-api/requirements.txt || true
          grep -q "werkzeug" services/payments-api/requirements.txt || echo "werkzeug==2.0.3" >> services/payments-api/requirements.txt

      - name: Create DAST docker-compose
        run: |
          cat > docker-compose.dast.yml << 'EOF'
          version: "3.9"
          services:
            postgres:
              image: postgres:15-alpine
              environment:
                POSTGRES_USER: sentinel
                POSTGRES_PASSWORD: sentinel123
                POSTGRES_DB: sentinelpay
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U sentinel"]
                interval: 5s
                timeout: 5s
                retries: 10
              volumes:
                - ./seed/init.sql:/docker-entrypoint-initdb.d/init.sql
            redis:
              image: redis:7-alpine
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 3s
                retries: 5
            payments-api:
              build: ./services/payments-api
              ports:
                - "8001:8001"
              environment:
                DATABASE_URL: postgresql://sentinel:sentinel123@postgres:5432/sentinelpay
                REDIS_URL: redis://redis:6379/0
                JWT_SECRET: test-secret-for-dast-only
                AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
                AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
                AWS_REGION: eu-west-2
                KYC_BUCKET: test-bucket
                WEBHOOK_TIMEOUT: "10"
                ENVIRONMENT: development
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_healthy
          EOF

      - name: Start ephemeral environment
        run: docker compose -f docker-compose.dast.yml up -d --build

      - name: Wait for payments-api to be ready
        run: |
          echo "Waiting for payments-api..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "payments-api is ready after $i attempts"
              curl -s http://localhost:8001/health
              break
            fi
            if [ "$i" -eq "30" ]; then
              echo "payments-api did not become ready — showing logs:"
              docker compose -f docker-compose.dast.yml logs payments-api
              exit 1
            fi
            echo "Attempt $i: not ready..."
            sleep 5
          done

      - name: Smoke test key endpoints
        run: |
          echo "Testing /health..."
          curl -sv http://localhost:8001/health
          echo ""
          echo "Testing /v1/auth/login..."
          curl -sv -X POST http://localhost:8001/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@test.com","password":"test"}' || true

      # ── ZAP Baseline Scan ─────────────────────────────────────────────────
      - name: Prepare ZAP output directory
        run: |
          mkdir -p /tmp/zap-output
          chmod 777 /tmp/zap-output
          # Copy rules file to a location ZAP can read
          mkdir -p /tmp/zap-rules
          cp .github/zap/rules.tsv /tmp/zap-rules/rules.tsv
          chmod -R 777 /tmp/zap-rules

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm \
            --network host \
            --user root \
            -v /tmp/zap-output:/zap/wrk/:rw \
            -v /tmp/zap-rules:/zap/rules/:ro \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8001 \
              -r zap-report.html \
              -J zap-report.json \
              -I \
              -l WARN \
              -c /zap/rules/rules.tsv || true

          cp /tmp/zap-output/zap-report.json . 2>/dev/null || true
          cp /tmp/zap-output/zap-report.html . 2>/dev/null || true
          echo "ZAP scan complete"
          ls -la /tmp/zap-output/

      - name: Evaluate ZAP results
        run: |
          python3 << 'EOF'
          import json, sys, os

          if not os.path.exists("zap-report.json") or os.path.getsize("zap-report.json") == 0:
              print("No ZAP report found — scan may not have completed")
              sys.exit(1)

          try:
              data = json.load(open("zap-report.json"))
          except json.JSONDecodeError as e:
              print(f"Could not parse ZAP report: {e}")
              sys.exit(1)

          high_alerts = []
          medium_alerts = []

          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  risk = alert.get("riskdesc", "").upper()
                  name = alert.get("name", "")
                  if "HIGH" in risk:
                      high_alerts.append(name)
                      print(f"[HIGH] {name}")
                  elif "MEDIUM" in risk:
                      medium_alerts.append(name)
                      print(f"[MEDIUM] {name}")

          print(f"\nZAP summary: {len(high_alerts)} HIGH, {len(medium_alerts)} MEDIUM alerts")

          if len(high_alerts) > 0:
              print("GATE FAILED: ZAP found HIGH risk alerts.")
              sys.exit(1)

          print("GATE PASSED: No HIGH risk alerts.")
          EOF

      - name: Tear down environment
        if: always()
        run: |
          docker compose -f docker-compose.dast.yml down -v 2>/dev/null || true
          rm -f docker-compose.dast.yml
          echo "Environment torn down"

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ github.run_id }}
          path: |
            zap-report.html
            zap-report.json
          retention-days: 30
